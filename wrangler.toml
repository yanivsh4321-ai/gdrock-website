# GDRock CDN Worker — deploy config for `wrangler deploy`
# Updates the existing "gdrock-cdn" Worker (cdn.gdrock.com).
#
# Secrets (SUPABASE_ANON_KEY, TELEGRAM_BOT_TOKEN, ANTHROPIC_API_KEY, ZEPTO_TOKEN,
# RESEND_API_KEY, …) live encrypted ON the Worker and are PRESERVED by a deploy —
# this file intentionally declares no [vars] so a deploy can never wipe them.
# The cdn.gdrock.com custom domain is attached in the dashboard and also persists.
#
# Deploy (one-time auth, then repeatable):
#   wrangler login            # opens browser OAuth, once
#   wrangler deploy           # ships gdrock-worker.js to gdrock-cdn
#
# keep_vars=true tells wrangler NOT to delete any vars/secrets that were set in
# the dashboard (SUPABASE_URL, MAIL_FROM, etc.) — without it, a CLI deploy can
# wipe dashboard-defined plaintext vars and break the live banner.

name = "gdrock-cdn"
main = "gdrock-worker.js"
compatibility_date = "2025-06-01"
keep_vars = true

# --- Deep check queue (optional until the German VPS runs) ------------------------------------
# Created 2026-09-19. Without this binding, /api/deep-scan keeps each request as a Supabase lead and
# pings Telegram so it can be run by hand. The VPS runner authenticates with the Worker secret
# DEEP_SCAN_RUNNER_TOKEN (wrangler secret put DEEP_SCAN_RUNNER_TOKEN).
# Jobs expire after 14 days (requesters' emails with them).
[[kv_namespaces]]
binding = "DEEP_SCAN"
id = "3c12ff4a7ff74d63b64bcc9753c6a06c"

# --- Scan rate limit (optional) -------------------------------------------------------------------
# The worker already limits real scans per IP in memory (20 per 10 minutes per instance). This adds
# Cloudflare's own counter across instances: 6 real scans per minute per IP.
# [[ratelimits]]
# name = "SCAN_LIMITER"
# namespace_id = "1001"
# simple = { limit = 6, period = 60 }
