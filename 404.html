.btn-primary{background:var(--ink);color:#08090c;}

.btn-outline{border:1px solid rgba(255,255,255,.16);color:var(--ink);}
.btn-outline:hover{background:rgba(255,255,255,.05);border-color:var(--ink2);transform:translateY(-2px);}
